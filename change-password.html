<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - CoolCare</title>
    <link rel="stylesheet" href="css/styles-v2.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <img src="assets/logo.svg" alt="CoolCare Logo" class="logo">
                <h1>CoolCare</h1>
            </div>
            <nav>
                <a href="login.html">Iniciar sesión</a>
                <a href="index.html">Inicio</a>
            </nav>
        </header>

        <main id="content">
            <section class="login-page">
                <div class="login-panel">
                    <div class="login-card">
                        <div class="card-header">
                            <h2>Cambiar contraseña</h2>
                            <p>Usa la contraseña temporal para crear tu nueva contraseña segura.</p>
                        </div>
                        <form id="change-password-form" class="auth-form">
                            <div class="form-grid columns-2">
                                <div class="input-group">
                                    <label for="email">Correo electrónico</label>
                                    <input type="email" id="email" name="email" placeholder="tucorreo@dominio.com" required readonly>
                                </div>
                                <div class="input-group">
                                    <label for="role">Rol</label>
                                    <input type="text" id="role" name="role" readonly>
                                </div>
                            </div>
                            <div class="input-group">
                                <label for="current-password">Contraseña temporal</label>
                                <input type="password" id="current-password" name="current-password" placeholder="********" required minlength="6">
                            </div>
                            <div class="input-group">
                                <label for="new-password">Nueva contraseña</label>
                                <input type="password" id="new-password" name="new-password" placeholder="********" required minlength="6">
                            </div>
                            <div class="input-group">
                                <label for="confirm-password">Confirmar nueva contraseña</label>
                                <input type="password" id="confirm-password" name="confirm-password" placeholder="********" required minlength="6">
                            </div>
                            <button type="submit" class="btn-primary">Actualizar contraseña</button>
                            <p class="helper-text"><a href="login.html">Volver a iniciar sesión</a></p>
                        </form>
                        <div id="change-password-message" class="login-message" aria-live="polite"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Proyecto Final ADSO</p>
        </footer>
    </div>
    <script src="js/change-password.js"></script>
</body>
</html>
