<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Proyecto Climatización</title>
    <link rel="stylesheet" href="css/styles-v2.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">ADSO</span>
                <h1>Proyecto Final</h1>
            </div>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="login.html">Iniciar sesión</a>
            </nav>
        </header>

        <main id="content">
            <section class="register-page">
                <div class="register-panel">
                    <div class="register-card">
                        <div class="card-header">
                            <h2>Registro de Cliente</h2>
                            <p>Crea tu cuenta para acceder al sistema de climatización.</p>
                        </div>
                        <form id="register-form" class="auth-form">
                            <div class="form-grid columns-2">
                                <div class="input-group">
                                    <label for="nombre">Nombre</label>
                                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                                </div>

                                <div class="input-group">
                                    <label for="apellido">Apellido</label>
                                    <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
                                </div>

                                <div class="input-group">
                                    <label for="email">Correo electrónico</label>
                                    <input type="email" id="email" name="email" placeholder="tucorreo@dominio.com" required>
                                </div>

                                <div class="input-group">
                                    <label for="telefono">Teléfono</label>
                                    <input type="tel" id="telefono" name="telefono" placeholder="Tu teléfono" required>
                                </div>

                                <div class="input-group">
                                    <label for="direccion">Dirección</label>
                                    <input type="text" id="direccion" name="direccion" placeholder="Tu dirección" required>
                                </div>

                                <div class="input-group">
                                    <label for="ciudad">Ciudad</label>
                                    <input type="text" id="ciudad" name="ciudad" placeholder="Tu ciudad" required>
                                </div>

                                <div class="input-group">
                                    <label for="pais">País</label>
                                    <input type="text" id="pais" name="pais" placeholder="Tu país" required>
                                </div>

                                <div class="input-group">
                                    <label for="empresa">Empresa</label>
                                    <input type="text" id="empresa" name="empresa" placeholder="Tu empresa" required>
                                </div>
                            </div>

                            <div class="input-group">
                                <label for="password">Contraseña</label>
                                <input type="password" id="password" name="password" placeholder="********" required minlength="6">
                            </div>

                            <div class="input-group">
                                <label for="confirm-password">Confirmar contraseña</label>
                                <input type="password" id="confirm-password" name="confirm-password" placeholder="********" required minlength="6">
                            </div>

                            <button type="submit" class="btn-primary">Registrarse</button>
                            <p class="helper-text">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
                        </form>
                        <div id="message" class="message"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Proyecto Final ADSO</p>
        </footer>
    </div>
    <script src="js/register.js"></script>
</body>
</html></content>
