<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetear contraseña - CoolCare</title>
    <link rel="stylesheet" href="css/styles-v2.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <img src="assets/logo.svg" alt="CoolCare Logo" class="logo">
                <h1>CoolCare</h1>
            </div>
            <nav>
                <a href="login.html">Iniciar sesión</a>
                <a href="index.html">Inicio</a>
            </nav>
        </header>

        <main id="content">
            <section class="login-page">
                <div class="login-panel">
                    <div class="login-card">
                        <div class="card-header">
                            <h2>Establecer nueva contraseña</h2>
                            <p>Crea una nueva contraseña segura para tu cuenta.</p>
                        </div>
                        <form id="reset-password-form" class="auth-form">
                            <div class="input-group">
                                <label for="email">Correo electrónico</label>
                                <input type="email" id="email" name="email" placeholder="tucorreo@dominio.com" required readonly>
                            </div>

                            <div class="input-group">
                                <label for="recovery-code">Código de recuperación</label>
                                <input type="text" id="recovery-code" name="recovery-code" placeholder="Código de 6 dígitos" required>
                            </div>

                            <div class="input-group">
                                <label for="new-password">Nueva contraseña</label>
                                <input type="password" id="new-password" name="new-password" placeholder="Mínimo 8 caracteres" required minlength="8">
                            </div>

                            <div class="input-group">
                                <label for="confirm-password">Confirmar contraseña</label>
                                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirma tu contraseña" required minlength="8">
                            </div>

                            <button type="submit" class="btn-primary">Actualizar contraseña</button>
                            <p class="helper-text"><a href="login.html">Volver a iniciar sesión</a></p>
                        </form>

                        <div id="reset-password-message" class="login-message" aria-live="polite"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Proyecto Final ADSO</p>
        </footer>
    </div>
    <script src="js/reset-password.js"></script>
</body>
</html>
